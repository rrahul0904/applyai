name: Agent Runtime Scale Benchmark

on:
  pull_request:
    paths:
      - "services/api/app/agents/**"
      - "services/api/app/agent_models.py"
      - "services/api/app/agent_policy_models.py"
      - "services/api/scripts/benchmark_agent_runtime.py"
      - "services/api/alembic/**"
      - ".github/workflows/agent-runtime-scale.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: applyai-agent-runtime-scale-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-runtime-scale:
    name: PostgreSQL agent runtime (${{ matrix.runs }} runs)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        include:
          - runs: 1000
            port: 55452
          - runs: 10000
            port: 55453
          - runs: 50000
            port: 55454
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: applyai
          POSTGRES_PASSWORD: applyai
          POSTGRES_DB: applyai_agent_benchmark
        ports:
          - "${{ matrix.port }}:5432"
        options: >-
          --health-cmd "pg_isready -U applyai -d applyai_agent_benchmark"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://applyai:applyai@127.0.0.1:${{ matrix.port }}/applyai_agent_benchmark
      RUN_COUNT: ${{ matrix.runs }}
      AI_PROVIDER: deterministic
      TASK_QUEUE_PROVIDER: memory

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.11"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Install API dependencies
        working-directory: services/api
        run: uv sync --group dev --locked
      - name: Apply all migrations
        working-directory: services/api
        run: uv run alembic upgrade head
      - name: Prepare benchmark artifact directory
        run: mkdir -p artifacts
      - name: Run measured PostgreSQL agent runtime benchmark
        working-directory: services/api
        env:
          PYTHONPATH: .
        run: |
          uv run python -m scripts.benchmark_agent_runtime --sizes "$RUN_COUNT" \
            | tee "../../artifacts/agent-runtime-${RUN_COUNT}.json"
      - name: Upload agent runtime benchmark report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: applyai-agent-runtime-${{ env.RUN_COUNT }}
          path: artifacts/agent-runtime-${{ env.RUN_COUNT }}.json
          retention-days: 30
          if-no-files-found: warn
