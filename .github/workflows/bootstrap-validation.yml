name: AWS Bootstrap Validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: applyai-bootstrap-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cloudformation:
    name: CloudFormation bootstrap lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.11'
      - name: Install cfn-lint
        run: python -m pip install --disable-pip-version-check 'cfn-lint==1.53.1'
      - name: Validate bootstrap template
        run: cfn-lint infra/bootstrap/applyai-staging-bootstrap.yaml
