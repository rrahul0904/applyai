name: ApplyAI CI

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"

permissions:
  contents: read

jobs:
  web:
    name: Web lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint web
        run: pnpm lint
      - name: Build web
        run: pnpm build

  api:
    name: API migrations and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: applyai
          POSTGRES_PASSWORD: applyai
          POSTGRES_DB: applyai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U applyai -d applyai_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://applyai:applyai@localhost:5432/applyai_test
      TEST_DATABASE_URL: postgresql+psycopg://applyai:applyai@localhost:5432/applyai_test
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install API dependencies
        run: uv sync --group dev --locked
      - name: Apply migrations from zero to head
        run: uv run alembic upgrade head
      - name: Check migration drift
        run: uv run alembic check
      - name: Run backend tests
        run: uv run pytest
