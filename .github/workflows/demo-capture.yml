name: ApplyAI Demo Capture

on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'services/api/**'
      - '.github/workflows/demo-capture.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: applyai-demo-capture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    name: Capture Candidate MVP demo
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: applyai
          POSTGRES_PASSWORD: applyai
          POSTGRES_DB: applyai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U applyai -d applyai_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://applyai:applyai@127.0.0.1:5432/applyai_test
      E2E_DATABASE_URL: postgresql+psycopg://applyai:applyai@127.0.0.1:5432/applyai_test
      E2E_RESUME_PATH: /tmp/applyai-demo-resume.docx
      DEMO_CAPTURE_DIR: ${{ github.workspace }}/apps/web/demo/screenshots
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.13.1
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.13.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.11'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Install API dependencies
        run: uv sync --project services/api --group dev --locked

      - name: Apply migrations
        run: cd services/api && uv run alembic upgrade head

      - name: Seed deterministic jobs
        run: cd services/api && uv run python -m app.jobs.seed

      - name: Create deterministic resume fixture
        run: cd services/api && uv run python scripts/create_e2e_resume.py "$E2E_RESUME_PATH"

      - name: Install Chromium
        run: pnpm --dir apps/web exec playwright install --with-deps chromium

      - name: Capture real Candidate MVP screens
        run: pnpm test:e2e

      - name: Upload demo screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: applyai-candidate-demo-${{ github.sha }}
          path: apps/web/demo/screenshots
          if-no-files-found: error
          retention-days: 14

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: applyai-demo-playwright-report-${{ github.sha }}
          path: apps/web/playwright-report
          if-no-files-found: ignore
          retention-days: 7
