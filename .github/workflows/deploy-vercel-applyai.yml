name: Deploy ApplyAI Web to Vercel

on:
  push:
    branches:
      - main
      - agent/applyai-finalization-wave
    paths:
      - apps/web/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/deploy-vercel-applyai.yml
  workflow_dispatch:
    inputs:
      target:
        description: Vercel deployment target
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production

permissions:
  contents: read

concurrency:
  group: applyai-vercel-${{ github.ref_name }}-${{ github.event_name == 'workflow_dispatch' && inputs.target || 'preview' }}
  cancel-in-progress: false

env:
  VERCEL_TEAM_ID: team_zmEezpOKGZy2sH5nqTfO44LD
  VERCEL_TEAM_SLUG: rrahul0904-5013s-projects
  VERCEL_PROJECT_NAME: applyai
  VERCEL_PROJECT_ROOT: apps/web
  DEPLOY_TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || github.ref_name == 'main' && 'production' || 'preview' }}

jobs:
  deploy:
    name: Deploy ApplyAI web
    runs-on: ubuntu-24.04
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target != 'production' || github.ref_name == 'main' || github.ref_name == 'agent/applyai-finalization-wave' }}
    environment: ${{ ((github.event_name == 'workflow_dispatch' && inputs.target == 'production') || (github.event_name == 'push' && github.ref_name == 'main')) && 'production' || 'preview' }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.13.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.13.0

      - name: Validate deployment secrets
        id: preflight
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          APPLYAI_API_URL: ${{ secrets.APPLYAI_VERCEL_API_URL }}
          SUPABASE_URL: ${{ secrets.APPLYAI_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.APPLYAI_SUPABASE_PUBLISHABLE_KEY }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.APPLYAI_VERCEL_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.APPLYAI_VERCEL_CLERK_SECRET_KEY }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DEPLOY_TARGET: ${{ env.DEPLOY_TARGET }}
        run: |
          set -euo pipefail

          if [ -z "${VERCEL_TOKEN:-}" ] || [ -z "${APPLYAI_API_URL:-}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "provider=none" >> "$GITHUB_OUTPUT"
            if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$REF_NAME" = "main" ] || [ "$DEPLOY_TARGET" = "production" ]; then
              echo "::error::VERCEL_TOKEN and APPLYAI_VERCEL_API_URL are required"
              exit 1
            fi
            echo "::warning::Skipping automatic preview because Vercel/API credentials are unavailable"
            exit 0
          fi

          if [ -n "${SUPABASE_URL:-}" ] && [ -n "${SUPABASE_PUBLISHABLE_KEY:-}" ]; then
            case "$SUPABASE_URL" in
              https://*.supabase.co) ;;
              *) echo "::error::APPLYAI_SUPABASE_URL must be the hosted HTTPS Supabase project URL"; exit 1 ;;
            esac
            echo "provider=supabase" >> "$GITHUB_OUTPUT"
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$DEPLOY_TARGET" = "production" ]; then
            echo "::error::Production deployment requires APPLYAI_SUPABASE_URL and APPLYAI_SUPABASE_PUBLISHABLE_KEY"
            exit 1
          fi

          # Transitional preview fallback only. Production can no longer certify with Clerk.
          if [ -n "${CLERK_PUBLISHABLE_KEY:-}" ] && [ -n "${CLERK_SECRET_KEY:-}" ]; then
            echo "provider=clerk" >> "$GITHUB_OUTPUT"
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Using temporary Clerk compatibility for preview; production requires Supabase"
            exit 0
          fi

          echo "ready=false" >> "$GITHUB_OUTPUT"
          echo "provider=none" >> "$GITHUB_OUTPUT"
          echo "::warning::Skipping preview because no identity-provider credentials are configured"

      - name: Install workspace dependencies
        if: ${{ steps.preflight.outputs.ready == 'true' }}
        run: pnpm install --frozen-lockfile

      - name: Install Vercel CLI
        if: ${{ steps.preflight.outputs.ready == 'true' }}
        run: pnpm add --global vercel@latest

      - name: Ensure dedicated ApplyAI Vercel project exists
        if: ${{ steps.preflight.outputs.ready == 'true' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          project_url="https://api.vercel.com/v9/projects/${VERCEL_PROJECT_NAME}?teamId=${VERCEL_TEAM_ID}"
          status="$(curl --silent --output /tmp/vercel-project.json --write-out '%{http_code}'             --header "Authorization: Bearer ${VERCEL_TOKEN}"             "$project_url")"

          if [ "$status" = "404" ]; then
            create_status="$(curl --silent --output /tmp/vercel-project-create.json --write-out '%{http_code}'               --request POST               --url "https://api.vercel.com/v11/projects?teamId=${VERCEL_TEAM_ID}"               --header "Authorization: Bearer ${VERCEL_TOKEN}"               --header "Content-Type: application/json"               --data "{\"name\":\"${VERCEL_PROJECT_NAME}\",\"framework\":\"nextjs\",\"rootDirectory\":\"${VERCEL_PROJECT_ROOT}\",\"installCommand\":\"cd ../.. && pnpm install --frozen-lockfile\",\"buildCommand\":\"pnpm build\",\"gitRepository\":{\"type\":\"github\",\"repo\":\"rrahul0904/applyai\"}}")"
            if [ "$create_status" -lt 200 ] || [ "$create_status" -ge 300 ]; then
              cat /tmp/vercel-project-create.json
              echo "::error::Unable to create the dedicated ApplyAI Vercel project"
              exit 1
            fi
          elif [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            cat /tmp/vercel-project.json
            echo "::error::Unable to inspect the ApplyAI Vercel project"
            exit 1
          fi

          patch_status="$(curl --silent --output /tmp/vercel-project-update.json --write-out '%{http_code}'             --request PATCH             --url "$project_url"             --header "Authorization: Bearer ${VERCEL_TOKEN}"             --header "Content-Type: application/json"             --data "{\"framework\":\"nextjs\",\"rootDirectory\":\"${VERCEL_PROJECT_ROOT}\",\"installCommand\":\"cd ../.. && pnpm install --frozen-lockfile\",\"buildCommand\":\"pnpm build\"}")"
          if [ "$patch_status" -lt 200 ] || [ "$patch_status" -ge 300 ]; then
            cat /tmp/vercel-project-update.json
            echo "::error::Unable to enforce ApplyAI Vercel project settings"
            exit 1
          fi

      - name: Link checkout to ApplyAI Vercel project
        if: ${{ steps.preflight.outputs.ready == 'true' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel link             --yes             --project "$VERCEL_PROJECT_NAME"             --scope "$VERCEL_TEAM_SLUG"             --token "$VERCEL_TOKEN"

      - name: Synchronize Vercel environment
        if: ${{ steps.preflight.outputs.ready == 'true' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          APPLYAI_API_URL: ${{ secrets.APPLYAI_VERCEL_API_URL }}
          SUPABASE_URL: ${{ secrets.APPLYAI_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.APPLYAI_SUPABASE_PUBLISHABLE_KEY }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.APPLYAI_VERCEL_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.APPLYAI_VERCEL_CLERK_SECRET_KEY }}
          AUTH_PROVIDER: ${{ steps.preflight.outputs.provider }}
        run: |
          set -euo pipefail

          set_env() {
            key="$1"
            value="$2"
            [ -z "$value" ] && return 0
            printf '%s' "$value" | vercel env add "$key" "$DEPLOY_TARGET"               --force --yes --scope "$VERCEL_TEAM_SLUG" --token "$VERCEL_TOKEN"
          }

          set_sensitive_env() {
            key="$1"
            value="$2"
            [ -z "$value" ] && return 0
            printf '%s' "$value" | vercel env add "$key" "$DEPLOY_TARGET"               --force --yes --sensitive --scope "$VERCEL_TEAM_SLUG" --token "$VERCEL_TOKEN"
          }

          set_sensitive_env APPLYAI_API_URL "$APPLYAI_API_URL"
          set_env APP_ENV "$([ "$DEPLOY_TARGET" = production ] && echo production || echo staging)"
          set_env DEV_AUTH_ENABLED false

          if [ "$AUTH_PROVIDER" = "supabase" ]; then
            set_env NEXT_PUBLIC_SUPABASE_URL "$SUPABASE_URL"
            set_env NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY "$SUPABASE_PUBLISHABLE_KEY"
          else
            set_env NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY "$CLERK_PUBLISHABLE_KEY"
            set_sensitive_env CLERK_SECRET_KEY "$CLERK_SECRET_KEY"
          fi

      - name: Pull Vercel project settings
        if: ${{ steps.preflight.outputs.ready == 'true' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel pull             --yes             --environment "$DEPLOY_TARGET"             --scope "$VERCEL_TEAM_SLUG"             --token "$VERCEL_TOKEN"

      - name: Build Vercel artifact
        if: ${{ steps.preflight.outputs.ready == 'true' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ "$DEPLOY_TARGET" = "production" ]; then
            vercel build --prod --scope "$VERCEL_TEAM_SLUG" --token "$VERCEL_TOKEN"
          else
            vercel build --scope "$VERCEL_TEAM_SLUG" --token "$VERCEL_TOKEN"
          fi

      - name: Deploy prebuilt artifact
        if: ${{ steps.preflight.outputs.ready == 'true' }}
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          if [ "$DEPLOY_TARGET" = "production" ]; then
            deployment_url="$(vercel deploy --prebuilt --prod --scope "$VERCEL_TEAM_SLUG" --token "$VERCEL_TOKEN")"
          else
            deployment_url="$(vercel deploy --prebuilt --scope "$VERCEL_TEAM_SLUG" --token "$VERCEL_TOKEN")"
          fi
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
          {
            echo "### ApplyAI Vercel deployment"
            echo "- Target: $DEPLOY_TARGET"
            echo "- Identity provider: ${{ steps.preflight.outputs.provider }}"
            echo "- Project: $VERCEL_PROJECT_NAME"
            echo "- Git ref: $GITHUB_REF_NAME"
            echo "- Git SHA: $GITHUB_SHA"
            echo "- URL: $deployment_url"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Probe deployed web application
        if: ${{ steps.preflight.outputs.ready == 'true' }}
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --location             --retry 5 --retry-delay 3             --output /tmp/applyai-vercel-home.html             "$DEPLOYMENT_URL/"
          test -s /tmp/applyai-vercel-home.html

      - name: Require Supabase production readiness
        if: ${{ steps.preflight.outputs.ready == 'true' && env.DEPLOY_TARGET == 'production' }}
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            if response="$(curl --fail --silent --show-error --location --max-time 20 "$DEPLOYMENT_URL/api/readiness" 2>/dev/null)" &&                printf '%s\n' "$response" | jq -e '
                 .production_ready == true and
                 .checks.api_configured == true and
                 .checks.api_reachable == true and
                 .checks.database_reachable == true and
                 .checks.storage_configured == true and
                 .checks.background_worker_configured == true and
                 .checks.auth_provider == "supabase" and
                 .checks.supabase_auth_configured == true and
                 .checks.supabase_instance_match == true and
                 .checks.operator_configured == true and
                 .checks.operator_auth_location == "database" and
                 .checks.dev_auth_enabled == false
               ' >/dev/null; then
              echo "Supabase production readiness passed on attempt $attempt" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          printf '%s\n' "$response" | jq . || true
          echo "::error::Production canary never reached the required Vercel + Supabase readiness state"
          exit 1
