name: ApplyAI Full Functional Certification

on:
  pull_request:
  push:
    branches:
      - agent/full-functional-certification-recovery
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: applyai-full-functional-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Fail-closed functional contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify required full-functional implementation exists
        run: python3 scripts/verify_full_functional_contract.py

      - name: Upload contract report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: applyai-functional-contract-${{ github.sha }}
          path: artifacts/predeploy/full-functional-contract.json
          if-no-files-found: error
          retention-days: 14

  predeploy:
    name: Repository-controlled predeploy certification
    needs: contract
    runs-on: ubuntu-latest
    env:
      REQUIRE_REAL_INVENTORY: "0"
      CI: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.13.1
          run_install: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.13.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.11"

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true

      - name: Run authoritative no-deploy certification
        run: pnpm release:predeploy-certify

      - name: Upload predeploy evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: applyai-predeploy-evidence-${{ github.sha }}
          path: |
            artifacts/predeploy
            .local/*.log
            apps/web/demo/screenshots
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 14
