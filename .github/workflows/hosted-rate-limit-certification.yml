name: ApplyAI Hosted Rate Limit Certification

on:
  workflow_dispatch:
    inputs:
      expected_api_tasks:
        description: Minimum healthy API tasks/ALB targets required for multi-instance certification
        required: true
        default: '2'
        type: string
      request_count:
        description: Concurrent write requests sent within one limiter window
        required: true
        default: '150'
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: applyai-hosted-rate-limit-certification
  cancel-in-progress: false

jobs:
  certify:
    name: Certify shared rate limiting across hosted API replicas
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      TF_VAR_web_origin: ${{ vars.WEB_ORIGIN }}
      TF_VAR_api_certificate_arn: ${{ vars.API_CERTIFICATE_ARN }}
      TF_VAR_clerk_issuer: ${{ vars.CLERK_ISSUER }}
      TF_VAR_clerk_jwks_url: ${{ vars.CLERK_JWKS_URL }}
      TF_VAR_clerk_audience: ${{ vars.CLERK_AUDIENCE }}
      TF_VAR_greenhouse_board_tokens: ${{ vars.GREENHOUSE_BOARD_TOKENS || '[]' }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate certification inputs
        shell: bash
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          EXPECTED_API_TASKS: ${{ inputs.expected_api_tasks }}
          REQUEST_COUNT: ${{ inputs.request_count }}
        run: |
          set -euo pipefail
          : "${AWS_DEPLOY_ROLE_ARN:?Set AWS_DEPLOY_ROLE_ARN}"
          : "${TF_STATE_BUCKET:?Set TF_STATE_BUCKET}"
          : "${API_BASE_URL:?Set API_BASE_URL}"
          case "$API_BASE_URL" in https://*) ;; *) echo 'API_BASE_URL must use HTTPS' >&2; exit 1 ;; esac
          [[ "$EXPECTED_API_TASKS" =~ ^[0-9]+$ ]] && [ "$EXPECTED_API_TASKS" -ge 2 ]
          [[ "$REQUEST_COUNT" =~ ^[0-9]+$ ]] && [ "$REQUEST_COUNT" -gt 120 ] && [ "$REQUEST_COUNT" -le 500 ]

      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@0e613a0980cbf65ed5b322eb7a1e075d28913a83
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: applyai-rate-limit-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.15.5'

      - name: Initialize staging state
        run: >-
          terraform -chdir=infra/staging init
          -backend-config="bucket=${TF_STATE_BUCKET}"
          -backend-config="region=${AWS_REGION}"

      - name: Require multi-instance API topology
        shell: bash
        env:
          EXPECTED_API_TASKS: ${{ inputs.expected_api_tasks }}
        run: |
          set -euo pipefail
          cluster="$(terraform -chdir=infra/staging output -raw ecs_cluster_name)"
          service="$(terraform -chdir=infra/staging output -raw api_service_name)"
          target_group="$(terraform -chdir=infra/staging output -raw api_target_group_arn)"

          aws ecs describe-services --cluster "$cluster" --services "$service" >/tmp/api-service.json
          jq -e --argjson expected "$EXPECTED_API_TASKS" '
            .failures | length == 0
          ' /tmp/api-service.json >/dev/null
          jq -e --argjson expected "$EXPECTED_API_TASKS" '
            .services[0].desiredCount >= $expected and
            .services[0].runningCount >= $expected and
            .services[0].pendingCount == 0 and
            (.services[0].deployments | any(.status == "PRIMARY" and .rolloutState == "COMPLETED"))
          ' /tmp/api-service.json >/dev/null

          aws elbv2 describe-target-health --target-group-arn "$target_group" >/tmp/target-health.json
          jq -e --argjson expected "$EXPECTED_API_TASKS" '
            [.TargetHealthDescriptions[] | select(.TargetHealth.State == "healthy")] | length >= $expected
          ' /tmp/target-health.json >/dev/null

          task_definition="$(jq -r '.services[0].taskDefinition' /tmp/api-service.json)"
          aws ecs describe-task-definition --task-definition "$task_definition" >/tmp/api-task-definition.json
          jq -e '
            .taskDefinition.containerDefinitions[] | select(.name == "api") |
            (.environment | any(.name == "ENVIRONMENT" and .value == "staging")) and
            ((.environment | map(select(.name == "RATE_LIMIT_ENABLED")) | length == 0) or
             (.environment | any(.name == "RATE_LIMIT_ENABLED" and .value != "false")))
          ' /tmp/api-task-definition.json >/dev/null

      - name: Certify shared write budget under concurrent traffic
        shell: bash
        env:
          REQUEST_COUNT: ${{ inputs.request_count }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/rate-limit
          python - <<'PY'
          import concurrent.futures
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          base = os.environ['API_BASE_URL'].rstrip('/')
          count = int(os.environ['REQUEST_COUNT'])
          url = f'{base}/api/v1/profile'

          # Start near the beginning of the fixed 60-second limiter window so
          # the bounded certification burst cannot accidentally straddle it.
          deadline = time.time() + 65
          while int(time.time()) % 60 > 5:
              if time.time() >= deadline:
                  raise SystemExit('Could not enter a fresh rate-limit window')
              time.sleep(0.25)

          def hit(_):
              request = urllib.request.Request(
                  url,
                  data=b'{}',
                  method='PUT',
                  headers={
                      'Content-Type': 'application/json',
                      'User-Agent': 'ApplyAI-Hosted-RateLimit-Certification/1.0',
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=15) as response:
                      return response.status, dict(response.headers)
              except urllib.error.HTTPError as exc:
                  return exc.code, dict(exc.headers)

          started = time.time()
          with concurrent.futures.ThreadPoolExecutor(max_workers=40) as pool:
              results = list(pool.map(hit, range(count)))
          elapsed = time.time() - started

          statuses = [status for status, _ in results]
          limited = [headers for status, headers in results if status == 429]
          server_errors = [status for status in statuses if status >= 500]
          non_limited = sum(1 for status in statuses if status != 429)

          report = {
              'request_count': count,
              'elapsed_seconds': round(elapsed, 3),
              'status_counts': {str(code): statuses.count(code) for code in sorted(set(statuses))},
              'non_429_count': non_limited,
              'rate_limited_count': len(limited),
              'server_error_count': len(server_errors),
          }
          print(json.dumps(report, indent=2))
          with open('artifacts/rate-limit/report.json', 'w') as handle:
              json.dump(report, handle, indent=2)

          if elapsed >= 50:
              raise SystemExit(f'Certification burst took too long for one limiter window: {elapsed:.2f}s')
          if server_errors:
              raise SystemExit(f'Hosted rate-limit burst produced 5xx responses: {server_errors[:10]}')
          if not limited:
              raise SystemExit('No 429 response observed; hosted limiter was not enforced')
          if non_limited > 120:
              raise SystemExit(f'Shared write budget exceeded: {non_limited} requests escaped 429')
          if not all(headers.get('Retry-After') and headers.get('RateLimit-Remaining') == '0' for headers in limited):
              raise SystemExit('429 responses did not carry the deterministic rate-limit headers')
          PY

      - name: Upload hosted rate-limit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: applyai-hosted-rate-limit-${{ github.run_id }}
          path: artifacts/rate-limit
          retention-days: 30
