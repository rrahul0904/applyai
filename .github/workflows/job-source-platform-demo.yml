name: ApplyAI Multi-Source Platform Demo

on:
  pull_request:
    paths:
      - 'services/api/app/jobs/demo.py'
      - 'services/api/scripts/build_job_source_demo.py'
      - 'services/api/tests/test_job_source_demo.py'
      - 'apps/web/scripts/capture-job-source-demo.mjs'
      - 'docs/JOB_SOURCE_PLATFORM_DEMO.md'
      - '.github/workflows/job-source-platform-demo.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: applyai-job-source-demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-demo:
    name: Build PostgreSQL-backed multi-source demo
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: applyai
          POSTGRES_PASSWORD: applyai
          POSTGRES_DB: applyai_demo
        ports:
          - 55441:5432
        options: >-
          --health-cmd "pg_isready -U applyai -d applyai_demo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://applyai:applyai@127.0.0.1:55441/applyai_demo
      DEMO_OUTPUT_DIR: ${{ github.workspace }}/artifacts/job-source-platform-demo
      DEMO_SCREENSHOT_DIR: ${{ github.workspace }}/artifacts/job-source-platform-demo/screenshots
      DEMO_BASE_URL: http://127.0.0.1:4173

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.13.1
          run_install: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.13.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.11'

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: |
          pnpm install --frozen-lockfile
          uv sync --project services/api --group dev --locked

      - name: Apply schema from zero to head
        working-directory: services/api
        run: |
          uv run alembic upgrade head
          uv run alembic current
          uv run alembic check

      - name: Run focused demo test
        working-directory: services/api
        run: uv run pytest tests/test_job_source_demo.py -q

      - name: Build database-backed demo artifact
        working-directory: services/api
        run: uv run python scripts/build_job_source_demo.py --output "$DEMO_OUTPUT_DIR"

      - name: Record immutable execution metadata
        run: |
          printf '%s\n' "source_sha=${GITHUB_SHA}" > "$DEMO_OUTPUT_DIR/execution.txt"
          printf '%s\n' "workflow_run_id=${GITHUB_RUN_ID}" >> "$DEMO_OUTPUT_DIR/execution.txt"
          printf '%s\n' "postgres_image=postgres:17" >> "$DEMO_OUTPUT_DIR/execution.txt"
          printf '%s\n' "generated_at=$(date -u +%FT%TZ)" >> "$DEMO_OUTPUT_DIR/execution.txt"

      - name: Install Chromium
        run: pnpm --dir apps/web exec playwright install --with-deps chromium

      - name: Serve generated artifact
        run: |
          python -m http.server 4173 --bind 127.0.0.1 --directory "$DEMO_OUTPUT_DIR" >/tmp/applyai-job-source-demo.log 2>&1 &
          echo $! >/tmp/applyai-job-source-demo.pid
          for attempt in {1..30}; do
            if curl --fail --silent "$DEMO_BASE_URL" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/applyai-job-source-demo.log
          exit 1

      - name: Capture overview, provenance, and evidence screens
        run: pnpm --dir apps/web exec node scripts/capture-job-source-demo.mjs

      - name: Verify artifact contents
        run: |
          test -s "$DEMO_OUTPUT_DIR/index.html"
          test -s "$DEMO_OUTPUT_DIR/report.json"
          test -s "$DEMO_OUTPUT_DIR/execution.txt"
          test -s "$DEMO_SCREENSHOT_DIR/01-platform-overview.png"
          test -s "$DEMO_SCREENSHOT_DIR/02-dedup-provenance.png"
          test -s "$DEMO_SCREENSHOT_DIR/03-execution-evidence.png"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads((Path(os.environ["DEMO_OUTPUT_DIR"]) / "report.json").read_text())
          assert all(report["assertions"].values())
          assert report["totals"]["provider_sources"] == 3
          assert report["totals"]["source_postings"] == 6
          assert report["totals"]["canonical_jobs"] == 4
          assert report["totals"]["deduplicated_postings"] == 2
          PY

      - name: Upload complete interactive demo
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: applyai-job-source-platform-demo-${{ github.sha }}
          path: artifacts/job-source-platform-demo
          if-no-files-found: error
          retention-days: 14
