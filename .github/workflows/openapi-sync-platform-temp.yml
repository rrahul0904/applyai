name: Platform Completion OpenAPI Sync

on:
  push:
    branches:
      - agent/platform-completion
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/platform-completion
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '10.13.1'
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.13.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
      - run: uv sync --project services/api --group dev --locked
      - run: pnpm install --frozen-lockfile
      - run: pnpm openapi:generate
      - name: Commit generated client contract
        run: |
          if git diff --quiet -- apps/web/lib/api/schema.d.ts; then
            echo "OpenAPI client already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/lib/api/schema.d.ts
          git commit -m "Regenerate platform OpenAPI client"
          git push origin HEAD:agent/platform-completion
