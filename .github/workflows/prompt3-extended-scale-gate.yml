name: Prompt 3 Extended Scale Gate

on:
  push:
    branches:
      - agent/applyai-job-data-scale-quality
    paths:
      - "services/api/scripts/benchmark_job_search.py"
      - ".github/workflows/prompt3-extended-scale-gate.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: applyai-prompt3-extended-scale-gate
  cancel-in-progress: true

jobs:
  benchmark:
    if: ${{ !contains(github.event.head_commit.message, '[prompt3-scale]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: applyai
          POSTGRES_PASSWORD: applyai
          POSTGRES_DB: applyai_scale
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U applyai -d applyai_scale"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://applyai:applyai@127.0.0.1:55432/applyai_scale
      PYTHONPATH: .
      TESTED_SHA: ${{ github.sha }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/applyai-job-data-scale-quality
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.11"

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      - name: Install API dependencies and migrate
        working-directory: services/api
        run: |
          uv sync --group dev --locked
          uv run alembic upgrade head

      - name: Execute 50K synthetic PostgreSQL benchmark
        working-directory: services/api
        run: >-
          uv run python scripts/benchmark_job_search.py
          --rows 50000
          --output ../../docs/benchmarks/job-search-50000.json
          --cleanup

      - name: Execute 250K synthetic PostgreSQL benchmark
        working-directory: services/api
        run: >-
          uv run python scripts/benchmark_job_search.py
          --rows 250000
          --output ../../docs/benchmarks/job-search-250000.json
          --cleanup

      - name: Record exact extended scale evidence
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg tested_sha "$TESTED_SHA" \
            --arg recorded_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --slurpfile fifty docs/benchmarks/job-search-50000.json \
            --slurpfile two_fifty docs/benchmarks/job-search-250000.json \
            '{
              status: "PASS",
              tested_sha: $tested_sha,
              recorded_at: $recorded_at,
              environment: "synthetic_github_hosted_postgresql",
              benchmarks: {
                "50000": $fifty[0],
                "250000": $two_fifty[0]
              },
              limitations: [
                "not Aurora",
                "not live provider data",
                "not a one-million-job claim",
                "not AWS cost evidence"
              ]
            }' > docs/benchmarks/prompt3-extended-scale-gate.json
          git config user.name 'applyai-ci'
          git config user.email 'applyai-ci@users.noreply.github.com'
          git add \
            docs/benchmarks/job-search-50000.json \
            docs/benchmarks/job-search-250000.json \
            docs/benchmarks/prompt3-extended-scale-gate.json
          git commit -m "Record Prompt 3 extended scale evidence [prompt3-scale]"
          git pull --rebase origin agent/applyai-job-data-scale-quality
          git push origin HEAD:agent/applyai-job-data-scale-quality
