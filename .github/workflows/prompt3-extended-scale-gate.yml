name: Prompt 3 Extended Scale Gate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: applyai-prompt3-extended-scale-gate
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: applyai
          POSTGRES_PASSWORD: applyai
          POSTGRES_DB: applyai_scale
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U applyai -d applyai_scale"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://applyai:applyai@127.0.0.1:55432/applyai_scale
      PYTHONPATH: .

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.11"

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      - name: Install API dependencies and migrate
        working-directory: services/api
        run: |
          uv sync --group dev --locked
          uv run alembic upgrade head

      - name: Execute 50K synthetic PostgreSQL benchmark
        working-directory: services/api
        run: >-
          uv run python scripts/benchmark_job_search.py
          --rows 50000
          --output ../../artifacts/job-search-50000.json
          --cleanup

      - name: Execute 250K synthetic PostgreSQL benchmark
        working-directory: services/api
        run: >-
          uv run python scripts/benchmark_job_search.py
          --rows 250000
          --output ../../artifacts/job-search-250000.json
          --cleanup

      - name: Upload extended benchmark evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: prompt3-extended-scale-${{ github.sha }}
          path: |
            artifacts/job-search-50000.json
            artifacts/job-search-250000.json
          retention-days: 30
          if-no-files-found: warn
