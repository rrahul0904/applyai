name: Prompt 3 Benchmark Report

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: applyai-prompt3-benchmark-report
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.11"
      - name: Render human-readable executed benchmark report
        run: python services/api/scripts/render_prompt3_benchmark_report.py
      - name: Upload rendered report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: prompt3-benchmark-report-${{ github.sha }}
          path: docs/JOB_DATA_PLATFORM_EXECUTED_BENCHMARKS.md
          retention-days: 30
