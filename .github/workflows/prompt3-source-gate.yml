name: Prompt 3 Source Gate

on:
  push:
    branches:
      - agent/applyai-job-data-scale-quality

permissions:
  contents: write

concurrency:
  group: applyai-prompt3-source-gate
  cancel-in-progress: true

jobs:
  verify:
    if: ${{ !contains(github.event.head_commit.message, '[prompt3-gate]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: applyai
          POSTGRES_PASSWORD: applyai
          POSTGRES_DB: applyai_prompt3
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U applyai -d applyai_prompt3"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://applyai:applyai@127.0.0.1:55432/applyai_prompt3
      PNPM_VERSION: 10.13.1
      NODE_VERSION: 22.13.0
      PYTHON_VERSION: 3.12.11
      TESTED_SHA: ${{ github.sha }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/applyai-job-data-scale-quality
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.15.5'

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          cd services/api
          uv sync --group dev --locked

      - name: Verify web and generated API contract
        run: |
          pnpm lint
          pnpm --dir apps/web typecheck
          pnpm test:web
          pnpm build
          pnpm openapi:check

      - name: Verify PostgreSQL migrations and backend tests
        working-directory: services/api
        run: |
          uv run alembic upgrade head
          uv run alembic current
          uv run alembic check
          uv run pytest

      - name: Verify Terraform and production API image
        run: |
          terraform -chdir=infra/staging fmt -check -recursive
          terraform -chdir=infra/staging init -backend=false
          terraform -chdir=infra/staging validate
          docker build -t applyai-api:prompt3-verification services/api

      - name: Execute 10K PostgreSQL benchmark
        working-directory: services/api
        run: >-
          uv run python scripts/benchmark_job_search.py
          --rows 10000
          --output ../../docs/benchmarks/job-search-10000.json
          --cleanup

      - name: Record exact tested source gate
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg tested_sha "$TESTED_SHA" \
            --arg recorded_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --slurpfile benchmark docs/benchmarks/job-search-10000.json \
            '{
              status: "PASS",
              tested_sha: $tested_sha,
              recorded_at: $recorded_at,
              gates: [
                "web_lint",
                "web_typecheck",
                "web_tests",
                "web_build",
                "openapi_drift",
                "alembic_zero_to_head",
                "alembic_current",
                "alembic_drift",
                "backend_tests",
                "terraform_fmt",
                "terraform_init",
                "terraform_validate",
                "api_docker_build",
                "postgresql_10000_explain_analyze"
              ],
              benchmark: $benchmark[0]
            }' > docs/benchmarks/prompt3-source-gate.json
          git config user.name 'applyai-ci'
          git config user.email 'applyai-ci@users.noreply.github.com'
          git add docs/benchmarks/job-search-10000.json docs/benchmarks/prompt3-source-gate.json
          git commit -m "Record Prompt 3 source gate [prompt3-gate]"
          git push origin HEAD:agent/applyai-job-data-scale-quality
