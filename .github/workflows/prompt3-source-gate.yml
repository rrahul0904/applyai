name: Prompt 3 Source Gate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: applyai-prompt3-source-gate
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: applyai
          POSTGRES_PASSWORD: applyai
          POSTGRES_DB: applyai_prompt3
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U applyai -d applyai_prompt3"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://applyai:applyai@127.0.0.1:55432/applyai_prompt3
      PNPM_VERSION: 10.13.1
      NODE_VERSION: 22.13.0
      PYTHON_VERSION: 3.12.11
      PYTHONPATH: .

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.15.5'

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          cd services/api
          uv sync --group dev --locked

      - name: Verify web and generated API contract
        run: |
          pnpm lint
          pnpm --dir apps/web typecheck
          pnpm test:web
          pnpm build
          pnpm openapi:check

      - name: Verify PostgreSQL migrations and backend tests
        working-directory: services/api
        run: |
          uv run alembic upgrade head
          uv run alembic current
          uv run alembic check
          uv run pytest

      - name: Verify Terraform and production API image
        run: |
          terraform -chdir=infra/staging fmt -check -recursive
          terraform -chdir=infra/staging init -backend=false
          terraform -chdir=infra/staging validate
          docker build -t applyai-api:prompt3-verification services/api

      - name: Execute 10K PostgreSQL benchmark
        working-directory: services/api
        run: >-
          uv run python scripts/benchmark_job_search.py
          --rows 10000
          --output ../../artifacts/job-search-10000.json
          --cleanup

      - name: Upload source-gate benchmark
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: prompt3-source-gate-${{ github.sha }}
          path: artifacts/job-search-10000.json
          retention-days: 30
          if-no-files-found: warn
