name: Prompt 3 Terraform Format

on:
  push:
    branches:
      - agent/applyai-job-data-scale-quality
    paths:
      - "infra/staging/**"
      - ".github/workflows/prompt3-terraform-format.yml"

permissions:
  contents: write

concurrency:
  group: applyai-prompt3-terraform-format
  cancel-in-progress: true

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[terraform-fmt]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/applyai-job-data-scale-quality
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.15.5'
      - name: Apply canonical Terraform formatting
        run: terraform -chdir=infra/staging fmt -recursive
      - name: Commit formatting when required
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- infra/staging; then
            echo 'Terraform files were already canonically formatted.'
            exit 0
          fi
          git config user.name 'applyai-ci'
          git config user.email 'applyai-ci@users.noreply.github.com'
          git add infra/staging
          git commit -m 'Format Prompt 3 Terraform [terraform-fmt]'
          git push origin HEAD:agent/applyai-job-data-scale-quality
