name: Reverse Engineering Fit

on:
  pull_request:
    paths:
      - "docs/reverse-engineering/**"
      - "scripts/validate_reverse_engineering_summaries.py"
      - ".github/workflows/reverse-engineering-fit.yml"
  push:
    branches:
      - main
    paths:
      - "docs/reverse-engineering/**"
      - "scripts/validate_reverse_engineering_summaries.py"
      - ".github/workflows/reverse-engineering-fit.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate reverse-engineering summaries
        run: python scripts/validate_reverse_engineering_summaries.py
