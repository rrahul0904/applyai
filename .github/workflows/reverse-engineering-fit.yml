name: Reverse Engineering Fit

on:
  pull_request:
    paths:
      - "docs/reverse-engineering/**"
      - "scripts/validate_reverse_engineering_summaries.py"
      - ".github/workflows/reverse-engineering-fit.yml"
  push:
    branches:
      - main
    paths:
      - "docs/reverse-engineering/**"
      - "scripts/validate_reverse_engineering_summaries.py"
      - ".github/workflows/reverse-engineering-fit.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Validate reverse-engineering summaries
        run: python scripts/validate_reverse_engineering_summaries.py
