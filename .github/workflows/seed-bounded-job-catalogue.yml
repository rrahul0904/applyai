name: Seed bounded job catalogue

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: applyai-bounded-job-seed
  cancel-in-progress: false

jobs:
  seed:
    if: github.repository == 'rrahul0904/applyai'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      APP_ENV: production
      DEPLOYMENT_PROFILE: lean
      AUTH_PROVIDER: clerk
      CLERK_ISSUER: ${{ secrets.CLERK_ISSUER }}
      CLERK_JWKS_URL: ${{ secrets.CLERK_JWKS_URL }}
      DATABASE_URL: ${{ secrets.APPLYAI_DATABASE_URL }}
      OBJECT_STORAGE_PROVIDER: postgres
      TASK_QUEUE_PROVIDER: postgres
      AI_PROVIDER: deterministic
      WEB_ORIGIN: https://applyai-preview.vercel.app
      BILLING_ENABLED: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.9.21"

      - name: Install locked dependencies
        working-directory: services/api
        run: uv sync --frozen --no-dev

      - name: Run each due source once
        working-directory: services/api
        run: uv run python scripts/sync_job_sources.py --mode synchronous
