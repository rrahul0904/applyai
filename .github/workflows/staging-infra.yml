name: ApplyAI Staging Infrastructure

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Plan only, or apply the dormant AWS staging foundation
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply

permissions:
  contents: read
  id-token: write

concurrency:
  group: applyai-staging-infrastructure
  cancel-in-progress: false

jobs:
  terraform:
    name: Terraform ${{ inputs.mode }}
    runs-on: ubuntu-latest
    environment: staging
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_VAR_web_origin: ${{ vars.WEB_ORIGIN }}
      TF_VAR_api_certificate_arn: ${{ vars.API_CERTIFICATE_ARN }}
      TF_VAR_clerk_issuer: ${{ vars.CLERK_ISSUER }}
      TF_VAR_clerk_jwks_url: ${{ vars.CLERK_JWKS_URL }}
      TF_VAR_clerk_audience: ${{ vars.CLERK_AUDIENCE }}
      TF_VAR_greenhouse_board_tokens: ${{ vars.GREENHOUSE_BOARD_TOKENS || '[]' }}
      TF_VAR_lever_site_names: ${{ vars.LEVER_SITE_NAMES || '[]' }}
      TF_VAR_ashby_board_names: ${{ vars.ASHBY_BOARD_NAMES || '[]' }}
      TF_VAR_image_tag: bootstrap
      TF_VAR_api_desired_count: '0'
      TF_VAR_worker_desired_count: '0'
      TF_VAR_outbox_desired_count: '0'
      TF_VAR_source_worker_desired_count: '0'
      TF_VAR_source_outbox_desired_count: '0'
      TF_VAR_ingestion_schedule_enabled: 'false'
      TF_VAR_source_dispatch_schedule_enabled: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate deployment environment inputs
        shell: bash
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          set -euo pipefail
          : "${AWS_DEPLOY_ROLE_ARN:?Set AWS_DEPLOY_ROLE_ARN in the GitHub staging environment}"
          : "${TF_STATE_BUCKET:?Set TF_STATE_BUCKET in the GitHub staging environment}"
          : "${TF_VAR_web_origin:?Set WEB_ORIGIN in the GitHub staging environment}"
          : "${TF_VAR_api_certificate_arn:?Set API_CERTIFICATE_ARN in the GitHub staging environment}"
          : "${TF_VAR_clerk_issuer:?Set CLERK_ISSUER in the GitHub staging environment}"
          : "${TF_VAR_clerk_jwks_url:?Set CLERK_JWKS_URL in the GitHub staging environment}"
          : "${TF_VAR_clerk_audience:?Set CLERK_AUDIENCE in the GitHub staging environment}"

          for value in \
            "$TF_VAR_greenhouse_board_tokens" \
            "$TF_VAR_lever_site_names" \
            "$TF_VAR_ashby_board_names"; do
            printf '%s' "$value" | jq -e '
              type == "array" and
              length <= 5 and
              all(.[]; type == "string" and length > 0)
            ' >/dev/null
          done

      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@0e613a0980cbf65ed5b322eb7a1e075d28913a83
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: applyai-staging-infra-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.15.5'

      - name: Check Terraform formatting
        run: terraform -chdir=infra/staging fmt -check -diff -recursive

      - name: Initialize remote state
        run: >-
          terraform -chdir=infra/staging init
          -backend-config="bucket=${TF_STATE_BUCKET}"
          -backend-config="region=${AWS_REGION}"

      - name: Validate Terraform
        run: terraform -chdir=infra/staging validate

      - name: Plan dormant staging foundation
        run: terraform -chdir=infra/staging plan -input=false -out=tfplan

      - name: Render reviewed plan artifacts
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=infra/staging show -json tfplan > infra/staging/tfplan.json
          terraform -chdir=infra/staging show -no-color tfplan > infra/staging/tfplan.txt
          jq '{
            create: [.resource_changes[]? | select(.change.actions == ["create"]) | .address],
            update: [.resource_changes[]? | select(.change.actions == ["update"]) | .address],
            replace: [.resource_changes[]? | select(.change.actions | index("delete") and index("create")) | .address],
            destroy: [.resource_changes[]? | select(.change.actions == ["delete"]) | .address]
          }' infra/staging/tfplan.json > infra/staging/tfplan-summary.json
          jq -e '.destroy | length == 0' infra/staging/tfplan-summary.json >/dev/null || {
            echo 'Terraform plan contains destroy actions. Review and correct before apply.' >&2
            cat infra/staging/tfplan-summary.json >&2
            exit 1
          }

      - name: Upload Terraform plan evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: applyai-staging-terraform-${{ inputs.mode }}-${{ github.sha }}
          path: |
            infra/staging/tfplan.txt
            infra/staging/tfplan-summary.json
          retention-days: 30

      - name: Apply dormant staging foundation
        if: inputs.mode == 'apply'
        run: terraform -chdir=infra/staging apply -input=false -auto-approve tfplan

      - name: Write infrastructure outputs
        if: inputs.mode == 'apply'
        run: |
          {
            echo '## ApplyAI staging foundation'
            echo
            echo 'Terraform applied with every API/worker/outbox desired count at 0.'
            echo 'Legacy ingestion and the source dispatcher remain disabled.'
            echo 'Reviewed Greenhouse, Lever and Ashby identifiers were passed to Terraform.'
            echo
            echo '```text'
            terraform -chdir=infra/staging output
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
