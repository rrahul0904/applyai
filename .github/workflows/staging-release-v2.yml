name: ApplyAI Staging Release V2

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full Git commit SHA to deploy; must be contained in main. Leave blank to use the workflow commit.
        required: false
        default: ""
        type: string
      enable_source_dispatch:
        description: Enable the bounded EventBridge source dispatcher after activation
        required: true
        default: false
        type: boolean
      source_worker_count:
        description: Dedicated source ingestion/verification worker count
        required: true
        default: "1"
        type: choice
        options:
          - "0"
          - "1"
          - "2"
          - "3"

permissions:
  contents: read
  id-token: write

concurrency:
  group: applyai-staging-release-v2
  cancel-in-progress: false

jobs:
  release:
    name: Build, migrate, activate all runtime roles, verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: staging
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      TF_VAR_web_origin: ${{ vars.WEB_ORIGIN }}
      TF_VAR_api_certificate_arn: ${{ vars.API_CERTIFICATE_ARN }}
      TF_VAR_clerk_issuer: ${{ vars.CLERK_ISSUER }}
      TF_VAR_clerk_jwks_url: ${{ vars.CLERK_JWKS_URL }}
      TF_VAR_clerk_audience: ${{ vars.CLERK_AUDIENCE }}
      TF_VAR_greenhouse_board_tokens: ${{ vars.GREENHOUSE_BOARD_TOKENS || '[]' }}
      TF_VAR_lever_site_names: ${{ vars.LEVER_SITE_NAMES || '[]' }}
      TF_VAR_ashby_board_names: ${{ vars.ASHBY_BOARD_NAMES || '[]' }}

    steps:
      - name: Checkout exact release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_sha || github.sha }}
          fetch-depth: 0

      - name: Validate deployment inputs and approved source
        id: source
        shell: bash
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          set -euo pipefail
          : "${AWS_DEPLOY_ROLE_ARN:?Set AWS_DEPLOY_ROLE_ARN in the GitHub staging environment}"
          : "${TF_STATE_BUCKET:?Set TF_STATE_BUCKET in the GitHub staging environment}"
          : "${API_BASE_URL:?Set API_BASE_URL in the GitHub staging environment}"
          : "${TF_VAR_web_origin:?Set WEB_ORIGIN in the GitHub staging environment}"
          : "${TF_VAR_api_certificate_arn:?Set API_CERTIFICATE_ARN in the GitHub staging environment}"
          : "${TF_VAR_clerk_issuer:?Set CLERK_ISSUER in the GitHub staging environment}"
          : "${TF_VAR_clerk_jwks_url:?Set CLERK_JWKS_URL in the GitHub staging environment}"
          : "${TF_VAR_clerk_audience:?Set CLERK_AUDIENCE in the GitHub staging environment}"
          case "$API_BASE_URL" in https://*) ;; *) echo 'API_BASE_URL must use HTTPS' >&2; exit 1 ;; esac

          for value in \
            "$TF_VAR_greenhouse_board_tokens" \
            "$TF_VAR_lever_site_names" \
            "$TF_VAR_ashby_board_names"; do
            printf '%s' "$value" | jq -e '
              type == "array" and
              length <= 5 and
              all(.[]; type == "string" and length > 0)
            ' >/dev/null
          done

          source_sha="$(git rev-parse HEAD)"
          test "${#source_sha}" = "40"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$source_sha" origin/main || {
            echo "Refusing to deploy ${source_sha}: it is not contained in origin/main." >&2
            exit 1
          }
          echo "source_sha=${source_sha}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@0e613a0980cbf65ed5b322eb7a1e075d28913a83
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: applyai-staging-release-v2-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.15.5'

      - name: Initialize staging state
        run: >-
          terraform -chdir=infra/staging init
          -backend-config="bucket=${TF_STATE_BUCKET}"
          -backend-config="region=${AWS_REGION}"

      - name: Resolve immutable release identifiers
        id: release
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          set -euo pipefail
          repository_url="$(terraform -chdir=infra/staging output -raw ecr_repository_url)"
          repository_name="${repository_url##*/}"
          cluster="$(terraform -chdir=infra/staging output -raw ecs_cluster_name)"
          subnets="$(terraform -chdir=infra/staging output -json app_subnet_ids | jq -r 'join(",")')"
          security_group="$(terraform -chdir=infra/staging output -raw ecs_security_group_id)"
          {
            echo "source_sha=${SOURCE_SHA}"
            echo "image_tag=${SOURCE_SHA}"
            echo "repository_url=${repository_url}"
            echo "repository_name=${repository_name}"
            echo "cluster=${cluster}"
            echo "subnets=${subnets}"
            echo "security_group=${security_group}"
          } >> "$GITHUB_OUTPUT"

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@62f4f872db3836360b72999f4b87f1ff13310f3a

      - name: Build and push immutable application image
        id: image
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.release.outputs.image_tag }}
          REPOSITORY_URL: ${{ steps.release.outputs.repository_url }}
          REPOSITORY_NAME: ${{ steps.release.outputs.repository_name }}
        run: |
          set -euo pipefail
          image_uri="${REPOSITORY_URL}:${IMAGE_TAG}"
          if aws ecr describe-images \
            --repository-name "$REPOSITORY_NAME" \
            --image-ids "imageTag=${IMAGE_TAG}" >/dev/null 2>&1; then
            echo "Reusing immutable image ${image_uri}."
          else
            docker build --pull --tag "$image_uri" services/api
            docker push "$image_uri"
          fi
          image_digest="$(aws ecr describe-images \
            --repository-name "$REPOSITORY_NAME" \
            --image-ids "imageTag=${IMAGE_TAG}" \
            --query 'imageDetails[0].imageDigest' \
            --output text)"
          test -n "$image_digest" && test "$image_digest" != "None"
          {
            echo "image_uri=${image_uri}"
            echo "image_digest=${image_digest}"
          } >> "$GITHUB_OUTPUT"

      - name: Register exact-image migration task
        id: migration_definition
        shell: bash
        env:
          IMAGE_URI: ${{ steps.image.outputs.image_uri }}
        run: |
          set -euo pipefail
          current="$(aws ecs describe-task-definition \
            --task-definition applyai-staging-migration \
            --query taskDefinition \
            --output json)"
          printf '%s' "$current" | jq --arg image "$IMAGE_URI" '
            del(
              .taskDefinitionArn,
              .revision,
              .status,
              .requiresAttributes,
              .compatibilities,
              .registeredAt,
              .registeredBy
            )
            | .containerDefinitions[0].image = $image
          ' > /tmp/applyai-migration-task.json
          task_definition="$(aws ecs register-task-definition \
            --cli-input-json file:///tmp/applyai-migration-task.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)"
          echo "task_definition=${task_definition}" >> "$GITHUB_OUTPUT"

      - name: Run Alembic migration gate
        id: migration
        shell: bash
        env:
          CLUSTER: ${{ steps.release.outputs.cluster }}
          TASK_DEFINITION: ${{ steps.migration_definition.outputs.task_definition }}
          SUBNETS: ${{ steps.release.outputs.subnets }}
          SECURITY_GROUP: ${{ steps.release.outputs.security_group }}
        run: |
          set -euo pipefail
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          task_arn="$(aws ecs run-task \
            --cluster "$CLUSTER" \
            --task-definition "$TASK_DEFINITION" \
            --launch-type FARGATE \
            --network-configuration \
              "awsvpcConfiguration={subnets=[${SUBNETS}],securityGroups=[${SECURITY_GROUP}],assignPublicIp=DISABLED}" \
            --query 'tasks[0].taskArn' \
            --output text)"
          test -n "$task_arn" && test "$task_arn" != "None"
          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$task_arn"
          task_json="$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$task_arn" --output json)"
          exit_code="$(printf '%s' "$task_json" | jq -r '.tasks[0].containers[0].exitCode // "missing"')"
          stopped_at="$(printf '%s' "$task_json" | jq -r '.tasks[0].stoppedAt // empty')"
          {
            echo "task_arn=${task_arn}"
            echo "exit_code=${exit_code}"
            echo "started_at=${started_at}"
            echo "stopped_at=${stopped_at}"
          } >> "$GITHUB_OUTPUT"
          if [ "$exit_code" != "0" ]; then
            printf '%s' "$task_json"
            echo "Migration failed; no service activation was attempted." >&2
            exit 1
          fi

      - name: Plan complete runtime activation
        env:
          TF_VAR_image_tag: ${{ steps.release.outputs.image_tag }}
          TF_VAR_api_desired_count: '1'
          TF_VAR_worker_desired_count: '1'
          TF_VAR_outbox_desired_count: '0'
          TF_VAR_source_worker_desired_count: ${{ inputs.source_worker_count }}
          TF_VAR_source_outbox_desired_count: '1'
          TF_VAR_ingestion_schedule_enabled: 'false'
          TF_VAR_source_dispatch_schedule_enabled: ${{ inputs.enable_source_dispatch }}
        run: terraform -chdir=infra/staging plan -input=false -out=release-v2.tfplan

      - name: Activate API, resume worker, source worker and source-aware outbox
        env:
          TF_VAR_image_tag: ${{ steps.release.outputs.image_tag }}
          TF_VAR_api_desired_count: '1'
          TF_VAR_worker_desired_count: '1'
          TF_VAR_outbox_desired_count: '0'
          TF_VAR_source_worker_desired_count: ${{ inputs.source_worker_count }}
          TF_VAR_source_outbox_desired_count: '1'
          TF_VAR_ingestion_schedule_enabled: 'false'
          TF_VAR_source_dispatch_schedule_enabled: ${{ inputs.enable_source_dispatch }}
        run: terraform -chdir=infra/staging apply -input=false -auto-approve release-v2.tfplan

      - name: Wait for all long-lived ECS services
        shell: bash
        env:
          CLUSTER: ${{ steps.release.outputs.cluster }}
        run: |
          set -euo pipefail
          services=(
            "$(terraform -chdir=infra/staging output -raw api_service_name)"
            "$(terraform -chdir=infra/staging output -raw worker_service_name)"
            "$(terraform -chdir=infra/staging output -raw source_worker_service_name)"
            "$(terraform -chdir=infra/staging output -raw source_outbox_service_name)"
          )
          aws ecs wait services-stable --cluster "$CLUSTER" --services "${services[@]}"

      - name: Verify HTTP health and readiness
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 12 --retry-delay 5 "${API_BASE_URL%/}/health"
          echo
          curl --fail --silent --show-error --retry 12 --retry-delay 5 "${API_BASE_URL%/}/ready"
          echo

      - name: Verify queue and service state
        shell: bash
        env:
          CLUSTER: ${{ steps.release.outputs.cluster }}
        run: |
          set -euo pipefail
          source_queue="$(terraform -chdir=infra/staging output -raw source_queue_url)"
          source_dlq="$(terraform -chdir=infra/staging output -raw source_dlq_url)"
          aws sqs get-queue-attributes --queue-url "$source_queue" --attribute-names All >/tmp/source-queue.json
          aws sqs get-queue-attributes --queue-url "$source_dlq" --attribute-names All >/tmp/source-dlq.json
          services=(
            "$(terraform -chdir=infra/staging output -raw api_service_name)"
            "$(terraform -chdir=infra/staging output -raw worker_service_name)"
            "$(terraform -chdir=infra/staging output -raw source_worker_service_name)"
            "$(terraform -chdir=infra/staging output -raw source_outbox_service_name)"
          )
          aws ecs describe-services \
            --cluster "$CLUSTER" \
            --services "${services[@]}" \
            --output json >/tmp/services.json
          jq -e '.failures | length == 0' /tmp/services.json >/dev/null
          jq -e 'all(.services[]; .runningCount == .desiredCount and .pendingCount == 0)' /tmp/services.json >/dev/null

      - name: Write release summary
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
          IMAGE_URI: ${{ steps.image.outputs.image_uri }}
          IMAGE_DIGEST: ${{ steps.image.outputs.image_digest }}
          MIGRATION_TASK_ARN: ${{ steps.migration.outputs.task_arn }}
          MIGRATION_TASK_DEFINITION: ${{ steps.migration_definition.outputs.task_definition }}
          MIGRATION_STARTED_AT: ${{ steps.migration.outputs.started_at }}
          MIGRATION_STOPPED_AT: ${{ steps.migration.outputs.stopped_at }}
          SOURCE_WORKER_COUNT: ${{ inputs.source_worker_count }}
          SOURCE_DISPATCH: ${{ inputs.enable_source_dispatch }}
        run: |
          {
            echo "## ApplyAI staging release V2"
            echo
            echo "- Deployed source commit: \`${SOURCE_SHA}\`"
            echo "- Image: \`${IMAGE_URI}\`"
            echo "- Image digest: \`${IMAGE_DIGEST}\`"
            echo "- Migration task definition: \`${MIGRATION_TASK_DEFINITION}\`"
            echo "- Migration task ARN: \`${MIGRATION_TASK_ARN}\`"
            echo "- Migration execution: \`${MIGRATION_STARTED_AT}\` → \`${MIGRATION_STOPPED_AT}\`"
            echo "- Alembic migration gate: passed"
            echo "- API, resume worker, source worker and source-aware outbox: stable"
            echo "- Source worker count: \`${SOURCE_WORKER_COUNT}\`"
            echo "- Source dispatcher enabled: \`${SOURCE_DISPATCH}\`"
            echo "- Legacy direct-ingestion schedule and resume-only outbox: disabled"
            echo "- Source queue and DLQ: reachable"
            echo "- \`/health\` and \`/ready\`: passed"
          } >> "$GITHUB_STEP_SUMMARY"
