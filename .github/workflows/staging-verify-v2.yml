name: ApplyAI Staging Verification V2

on:
  workflow_dispatch:
    inputs:
      expect_source_dispatch_enabled:
        description: Require the EventBridge source dispatcher to be enabled
        required: true
        default: false
        type: boolean
      expect_ai_runtime_enabled:
        description: Require Career Intelligence V2 worker and universal outbox to be running
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: applyai-staging-verification-v2
  cancel-in-progress: true

jobs:
  verify:
    name: Verify API, ECS, queues, database, source and AI runtimes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      TF_VAR_web_origin: ${{ vars.WEB_ORIGIN }}
      TF_VAR_api_certificate_arn: ${{ vars.API_CERTIFICATE_ARN }}
      TF_VAR_clerk_issuer: ${{ vars.CLERK_ISSUER }}
      TF_VAR_clerk_jwks_url: ${{ vars.CLERK_JWKS_URL }}
      TF_VAR_clerk_audience: ${{ vars.CLERK_AUDIENCE }}
      TF_VAR_greenhouse_board_tokens: ${{ vars.GREENHOUSE_BOARD_TOKENS || '[]' }}
      TF_VAR_lever_site_names: ${{ vars.LEVER_SITE_NAMES || '[]' }}
      TF_VAR_ashby_board_names: ${{ vars.ASHBY_BOARD_NAMES || '[]' }}
      TF_VAR_ai_provider: ${{ vars.AI_PROVIDER || 'deterministic' }}
      TF_VAR_openai_api_key_secret_arn: ${{ vars.OPENAI_API_KEY_SECRET_ARN || '' }}
      TF_VAR_openai_model: ${{ vars.OPENAI_MODEL || 'gpt-5.6-luna' }}
      TF_VAR_openai_reasoning_effort: ${{ vars.OPENAI_REASONING_EFFORT || 'low' }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate verification inputs
        shell: bash
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          set -euo pipefail
          : "${AWS_DEPLOY_ROLE_ARN:?Set AWS_DEPLOY_ROLE_ARN}"
          : "${TF_STATE_BUCKET:?Set TF_STATE_BUCKET}"
          : "${API_BASE_URL:?Set API_BASE_URL}"
          case "$API_BASE_URL" in https://*) ;; *) echo 'API_BASE_URL must use HTTPS' >&2; exit 1 ;; esac

      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@0e613a0980cbf65ed5b322eb7a1e075d28913a83
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: applyai-staging-verify-v2-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.15.5'

      - name: Initialize staging state
        run: >-
          terraform -chdir=infra/staging init
          -backend-config="bucket=${TF_STATE_BUCKET}"
          -backend-config="region=${AWS_REGION}"

      - name: Verify HTTP health and database readiness
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "${API_BASE_URL%/}/health" >/tmp/health.json
          curl --fail --silent --show-error "${API_BASE_URL%/}/ready" >/tmp/ready.json
          cat /tmp/health.json
          echo
          cat /tmp/ready.json
          echo

      - name: Verify ALB target health
        shell: bash
        run: |
          set -euo pipefail
          target_group="$(terraform -chdir=infra/staging output -raw api_target_group_arn)"
          aws elbv2 describe-target-health --target-group-arn "$target_group" >/tmp/target-health.json
          jq -e '[.TargetHealthDescriptions[] | select(.TargetHealth.State == "healthy")] | length > 0' /tmp/target-health.json >/dev/null
          jq -e 'all(.TargetHealthDescriptions[]; .TargetHealth.State == "healthy")' /tmp/target-health.json >/dev/null

      - name: Verify required ECS services and immutable image consistency
        shell: bash
        env:
          EXPECT_AI_RUNTIME: ${{ inputs.expect_ai_runtime_enabled }}
        run: |
          set -euo pipefail
          cluster="$(terraform -chdir=infra/staging output -raw ecs_cluster_name)"
          core_services=(
            "$(terraform -chdir=infra/staging output -raw api_service_name)"
            "$(terraform -chdir=infra/staging output -raw worker_service_name)"
            "$(terraform -chdir=infra/staging output -raw source_worker_service_name)"
            "$(terraform -chdir=infra/staging output -raw source_outbox_service_name)"
          )
          ai_services=(
            "$(terraform -chdir=infra/staging output -raw ai_worker_service_name)"
            "$(terraform -chdir=infra/staging output -raw ai_outbox_service_name)"
          )
          services=("${core_services[@]}" "${ai_services[@]}")
          aws ecs describe-services --cluster "$cluster" --services "${services[@]}" --output json >/tmp/services.json
          jq -e '.failures | length == 0' /tmp/services.json >/dev/null

          for service in "${core_services[@]}"; do
            jq -e --arg service "$service" '
              .services[] | select(.serviceName == $service) |
              .desiredCount > 0 and .runningCount == .desiredCount and .pendingCount == 0 and
              (.deployments | any(.status == "PRIMARY" and .rolloutState == "COMPLETED"))
            ' /tmp/services.json >/dev/null
          done
          for service in "${ai_services[@]}"; do
            if [ "$EXPECT_AI_RUNTIME" = "true" ]; then
              jq -e --arg service "$service" '
                .services[] | select(.serviceName == $service) |
                .desiredCount > 0 and .runningCount == .desiredCount and .pendingCount == 0 and
                (.deployments | any(.status == "PRIMARY" and .rolloutState == "COMPLETED"))
              ' /tmp/services.json >/dev/null
            else
              jq -e --arg service "$service" '
                .services[] | select(.serviceName == $service) |
                .runningCount == .desiredCount and .pendingCount == 0
              ' /tmp/services.json >/dev/null
            fi
          done

          : > /tmp/runtime-images.txt
          jq -r '.services[] | select(.desiredCount > 0) | .serviceName' /tmp/services.json >/tmp/enabled-services.txt
          while IFS= read -r service; do
            task_definition="$(aws ecs describe-services --cluster "$cluster" --services "$service" --query 'services[0].taskDefinition' --output text)"
            aws ecs describe-task-definition --task-definition "$task_definition" --query 'taskDefinition.containerDefinitions[].image' --output text >> /tmp/runtime-images.txt
          done </tmp/enabled-services.txt
          test "$(tr '\t ' '\n' < /tmp/runtime-images.txt | sed '/^$/d' | sort -u | wc -l | tr -d ' ')" = "1"

      - name: Verify running ECS tasks use private application subnets
        shell: bash
        run: |
          set -euo pipefail
          cluster="$(terraform -chdir=infra/staging output -raw ecs_cluster_name)"
          app_subnets="$(terraform -chdir=infra/staging output -json app_subnet_ids)"
          : > /tmp/task-arns.txt
          while IFS= read -r service; do
            aws ecs list-tasks --cluster "$cluster" --service-name "$service" --desired-status RUNNING --query 'taskArns[]' --output text | tr '\t' '\n' >> /tmp/task-arns.txt
          done </tmp/enabled-services.txt
          sed -i '/^$/d' /tmp/task-arns.txt
          test -s /tmp/task-arns.txt
          mapfile -t task_arns < /tmp/task-arns.txt
          aws ecs describe-tasks --cluster "$cluster" --tasks "${task_arns[@]}" >/tmp/tasks.json
          jq -r '.tasks[].attachments[]?.details[]? | select(.name == "networkInterfaceId") | .value' /tmp/tasks.json > /tmp/eni-ids.txt
          test -s /tmp/eni-ids.txt
          mapfile -t eni_ids < /tmp/eni-ids.txt
          aws ec2 describe-network-interfaces --network-interface-ids "${eni_ids[@]}" >/tmp/enis.json
          jq -e --argjson app_subnets "$app_subnets" '
            all(.NetworkInterfaces[];
              (.Association.PublicIp? == null) and
              (.SubnetId as $subnet | $app_subnets | index($subnet) != null)
            )
          ' /tmp/enis.json >/dev/null

      - name: Verify resume, source and AI queue encryption and redrive
        shell: bash
        run: |
          set -euo pipefail
          resume_queue="$(terraform -chdir=infra/staging output -raw resume_queue_url)"
          resume_dlq="$(terraform -chdir=infra/staging output -raw resume_dlq_url)"
          resume_dlq_arn="$(terraform -chdir=infra/staging output -raw resume_dlq_arn)"
          source_queue="$(terraform -chdir=infra/staging output -raw source_queue_url)"
          source_dlq="$(terraform -chdir=infra/staging output -raw source_dlq_url)"
          source_dlq_arn="$(terraform -chdir=infra/staging output -raw source_dlq_arn)"
          ai_queue="$(terraform -chdir=infra/staging output -raw ai_queue_url)"
          ai_dlq="$(terraform -chdir=infra/staging output -raw ai_dlq_url)"

          for queue in "$resume_queue" "$resume_dlq" "$source_queue" "$source_dlq" "$ai_queue" "$ai_dlq"; do
            attributes="$(aws sqs get-queue-attributes --queue-url "$queue" --attribute-names All --output json)"
            test "$(printf '%s' "$attributes" | jq -r '.Attributes.SqsManagedSseEnabled')" = "true"
          done

          resume_policy="$(aws sqs get-queue-attributes --queue-url "$resume_queue" --attribute-names RedrivePolicy --query 'Attributes.RedrivePolicy' --output text)"
          source_attributes="$(aws sqs get-queue-attributes --queue-url "$source_queue" --attribute-names RedrivePolicy VisibilityTimeout --output json)"
          ai_attributes="$(aws sqs get-queue-attributes --queue-url "$ai_queue" --attribute-names RedrivePolicy VisibilityTimeout --output json)"
          source_policy="$(printf '%s' "$source_attributes" | jq -r '.Attributes.RedrivePolicy')"
          ai_policy="$(printf '%s' "$ai_attributes" | jq -r '.Attributes.RedrivePolicy')"
          test "$(printf '%s' "$resume_policy" | jq -r '.deadLetterTargetArn')" = "$resume_dlq_arn"
          test "$(printf '%s' "$source_policy" | jq -r '.deadLetterTargetArn')" = "$source_dlq_arn"
          test "$(printf '%s' "$resume_policy" | jq -r '.maxReceiveCount | tonumber')" -gt 1
          test "$(printf '%s' "$source_policy" | jq -r '.maxReceiveCount | tonumber')" -gt 1
          test "$(printf '%s' "$ai_policy" | jq -r '.maxReceiveCount | tonumber')" -gt 1
          test "$(printf '%s' "$source_attributes" | jq -r '.Attributes.VisibilityTimeout')" -ge 60
          test "$(printf '%s' "$ai_attributes" | jq -r '.Attributes.VisibilityTimeout')" -ge 60

      - name: Verify private resume bucket controls
        shell: bash
        run: |
          set -euo pipefail
          bucket="$(terraform -chdir=infra/staging output -raw resume_bucket_name)"
          aws s3api get-public-access-block --bucket "$bucket" >/tmp/resume-public-access.json
          jq -e '
            .PublicAccessBlockConfiguration.BlockPublicAcls == true and
            .PublicAccessBlockConfiguration.IgnorePublicAcls == true and
            .PublicAccessBlockConfiguration.BlockPublicPolicy == true and
            .PublicAccessBlockConfiguration.RestrictPublicBuckets == true
          ' /tmp/resume-public-access.json >/dev/null
          test "$(aws s3api get-bucket-versioning --bucket "$bucket" --query Status --output text)" = "Enabled"
          aws s3api get-bucket-encryption --bucket "$bucket" >/dev/null

      - name: Verify Aurora encryption, backup and private instance state
        shell: bash
        run: |
          set -euo pipefail
          cluster_id="$(terraform -chdir=infra/staging output -raw aurora_cluster_identifier)"
          instance_id="$(terraform -chdir=infra/staging output -raw aurora_instance_identifier)"
          secret_arn="$(terraform -chdir=infra/staging output -raw aurora_master_secret_arn)"
          aws rds describe-db-clusters --db-cluster-identifier "$cluster_id" >/tmp/cluster.json
          aws rds describe-db-instances --db-instance-identifier "$instance_id" >/tmp/instance.json
          jq -e '.DBClusters[0].Status == "available" and .DBClusters[0].StorageEncrypted == true and .DBClusters[0].BackupRetentionPeriod >= 7' /tmp/cluster.json >/dev/null
          jq -e '.DBInstances[0].DBInstanceStatus == "available" and .DBInstances[0].PubliclyAccessible == false' /tmp/instance.json >/dev/null
          aws secretsmanager describe-secret --secret-id "$secret_arn" >/dev/null

      - name: Verify dispatcher state and task definition
        shell: bash
        env:
          EXPECT_ENABLED: ${{ inputs.expect_source_dispatch_enabled }}
        run: |
          set -euo pipefail
          dispatcher_family="$(terraform -chdir=infra/staging output -raw source_dispatch_task_family)"
          aws ecs describe-task-definition --task-definition "$dispatcher_family" >/dev/null
          rule_name="$(terraform -chdir=infra/staging output -raw source_dispatch_rule_name)"
          aws events describe-rule --name "$rule_name" >/tmp/source-rule.json
          expected_state="DISABLED"
          if [ "$EXPECT_ENABLED" = "true" ]; then expected_state="ENABLED"; fi
          test "$(jq -r '.State' /tmp/source-rule.json)" = "$expected_state"

      - name: Verify CloudWatch logs and source/AI alarms exist
        shell: bash
        run: |
          set -euo pipefail
          log_groups=(
            /applyai/staging/api
            /applyai/staging/worker
            /applyai/staging/migration
            /applyai/staging/source-worker
            /applyai/staging/source-dispatcher
            /applyai/staging/outbox-v2
            /applyai/staging/ai-worker
            /applyai/staging/outbox-v3
          )
          for log_group in "${log_groups[@]}"; do
            count="$(aws logs describe-log-groups --log-group-name-prefix "$log_group" --query "length(logGroups[?logGroupName=='${log_group}'])" --output text)"
            test "$count" = "1"
          done

          alarms=(
            applyai-staging-source-queue-depth
            applyai-staging-source-oldest-message
            applyai-staging-source-dlq-not-empty
            applyai-staging-source-task-failures
            applyai-staging-ai-queue-depth
            applyai-staging-ai-oldest-message
            applyai-staging-ai-dlq-nonempty
          )
          for alarm in "${alarms[@]}"; do
            count="$(aws cloudwatch describe-alarms --alarm-names "$alarm" --query 'length(MetricAlarms)' --output text)"
            test "$count" = "1"
          done

      - name: Write verification summary
        shell: bash
        env:
          EXPECT_SOURCE_DISPATCH: ${{ inputs.expect_source_dispatch_enabled }}
          EXPECT_AI_RUNTIME: ${{ inputs.expect_ai_runtime_enabled }}
        run: |
          image="$(tr '\t ' '\n' < /tmp/runtime-images.txt | sed '/^$/d' | sort -u)"
          {
            echo "## ApplyAI staging infrastructure verification V2"
            echo
            echo "- API health/readiness and ALB target health: passed"
            echo "- Candidate and source runtimes: nonzero and stable"
            echo "- Career Intelligence runtime expected enabled: \`${EXPECT_AI_RUNTIME}\`"
            echo "- Runtime image consistency: \`${image}\`"
            echo "- ECS tasks: private application subnets with no public IP"
            echo "- Resume, source and AI SQS/DLQ encryption/redrive: passed"
            echo "- Private/versioned/encrypted resume S3: passed"
            echo "- Aurora: available, encrypted, backed up and private"
            echo "- Source dispatcher expected enabled: \`${EXPECT_SOURCE_DISPATCH}\`"
            echo "- Required runtime log groups and source/AI alarms: present"
            echo
            echo "This verifies deployed infrastructure state only. Real provider ingestion, real model invocation, Candidate A/B acceptance, failure injection, restore drills and cost measurement remain separate staging evidence."
          } >> "$GITHUB_STEP_SUMMARY"
