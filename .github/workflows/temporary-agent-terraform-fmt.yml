name: Temporary Agent Terraform Format

on:
  push:
    branches:
      - agent/governed-agent-runtime
    paths:
      - "infra/staging/agent_runtime.tf"
      - ".github/workflows/temporary-agent-terraform-fmt.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/governed-agent-runtime
          fetch-depth: 0
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v3
        with:
          terraform_version: "1.13.5"
      - name: Apply canonical Terraform formatting
        run: terraform fmt infra/staging/agent_runtime.tf infra/staging/agent_outputs.tf
      - name: Commit formatting when needed
        shell: bash
        run: |
          if git diff --quiet -- infra/staging/agent_runtime.tf infra/staging/agent_outputs.tf; then
            echo "Terraform is already canonically formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add infra/staging/agent_runtime.tf infra/staging/agent_outputs.tf
          git commit -m "Format governed agent Terraform"
          git push origin HEAD:agent/governed-agent-runtime
