name: Temporary launch dependency lock refresh

on:
  push:
    branches:
      - test/launch-security-certification
    paths:
      - apps/web/package.json
      - services/api/pyproject.toml

permissions:
  contents: write

jobs:
  refresh-locks:
    if: github.repository == 'rrahul0904/applyai' && github.ref == 'refs/heads/test/launch-security-certification'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: test/launch-security-certification
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.13.1
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.13.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.11"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Refresh pnpm lock
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Refresh uv lock
        run: uv lock --project services/api
      - name: Commit generated lockfiles
        shell: bash
        run: |
          if git diff --quiet -- pnpm-lock.yaml services/api/uv.lock; then
            echo "Lockfiles already current."
            exit 0
          fi
          git config user.name "applyai-launch-certifier"
          git config user.email "actions@users.noreply.github.com"
          git add pnpm-lock.yaml services/api/uv.lock
          git commit -m "chore: refresh security dependency locks"
          git push origin HEAD:test/launch-security-certification
