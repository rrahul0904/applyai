services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: applyai
      POSTGRES_USER: applyai
      POSTGRES_PASSWORD: applyai
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U applyai -d applyai"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - applyai-postgres:/var/lib/postgresql/data

  localstack:
    image: localstack/localstack:4.14.0
    environment:
      SERVICES: s3,sqs
      AWS_DEFAULT_REGION: us-east-1
      DEBUG: "0"
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4566/_localstack/health >/dev/null || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - applyai-localstack:/var/lib/localstack

  mailpit:
    image: axllent/mailpit:v1.30.6
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 20

  stripe-mock:
    image: stripe/stripe-mock:v0.202.0
    ports:
      - "12111:12111"
      - "12112:12112"

volumes:
  applyai-postgres:
  applyai-localstack:
