services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: applyai
      POSTGRES_USER: applyai
      POSTGRES_PASSWORD: applyai
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U applyai -d applyai"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - applyai-postgres:/var/lib/postgresql/data

volumes:
  applyai-postgres:
