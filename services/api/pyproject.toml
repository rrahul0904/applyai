[project]
name = "applyai-api"
version = "0.1.0"
description = "ApplyAI FastAPI modular monolith"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16.4",
  "boto3>=1.39.16",
  "email-validator>=2.2.0",
  "fastapi>=0.116.1",
  "httpx>=0.28.1",
  "psycopg[binary]>=3.2.9",
  "pydantic-settings>=2.10.1",
  "pyjwt[crypto]>=2.10.1",
  "pypdf>=5.9.0",
  "python-docx>=1.2.0",
  "python-multipart>=0.0.20",
  "sqlalchemy>=2.0.41",
  "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = [
  "pytest>=8.4.1",
  "pytest-asyncio>=1.1.0",
  "pytest-cov>=6.2.1",
  "reportlab>=4.4.3",
]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
markers = [
  "postgres: requires a PostgreSQL test database",
]

[tool.ruff]
line-length = 100
target-version = "py312"
